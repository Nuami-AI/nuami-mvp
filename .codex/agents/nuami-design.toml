## 9. Design Principles

1. **Lavender = primary action**: Buttons, focus rings → `accent-700` (`#8651F2`). Not coral.
2. **Coral = accent/point**: `brand-500` (`#F97E6D`) for highlights, not CTAs.
3. **Warm gray always**: Use `gray-*` over pure neutrals. Body text = `text-text-primary`, not `text-gray-900` directly.
4. **Semantic tokens first**: Prefer `bg-background`, `text-text-secondary`, `border-line-normal` over raw values.
5. **Hidden scrollbars**: `body`/`html` have `scrollbar-width: none`. Use `ScrollArea` for scrollable zones.
6. **`word-break: auto-phrase`**: Applied globally on `*` for CJK text wrapping.

---

## 10. Common Patterns

### Page wrapper
```tsx
<div className="min-h-screen bg-background text-text-primary font-sans">
  ...
</div>
```

### Primary CTA button
```tsx
<Button>저장하기</Button>
// bg-button-primary (accent-700 #8651F2) by default
```

### Danger / state buttons
```tsx
<Button className="bg-danger hover:bg-danger-600 text-white">삭제</Button>
```

### Form field
```tsx
<div className="flex flex-col gap-1.5">
  <Label htmlFor="email">이메일</Label>
  <Input id="email" type="email" placeholder="name@example.com" />
</div>
```

### Card
```tsx
<Card>
  <CardHeader>
    <CardTitle className="text-text-primary">제목</CardTitle>
    <CardDescription className="text-text-secondary">설명</CardDescription>
  </CardHeader>
  <CardContent>내용</CardContent>
</Card>
```

### Status badge
```tsx
<Badge className="bg-success text-white">완료</Badge>
<Badge className="bg-danger text-white">오류</Badge>
<Badge className="bg-warning text-white">대기</Badge>
<Badge className="bg-info text-white">정보</Badge>
```

### Info box
```tsx
<div className="bg-infoBox rounded-md p-4 text-text-secondary">
  안내 메시지
</div>
```

### Border / divider
```tsx
<div className="border border-line-normal rounded-lg p-4">...</div>
<Separator className="bg-line-neutral" />
```

### Disabled input
```tsx
<Input disabled className="bg-form-disabled text-text-disabled" />
