## 3. Spacing Tokens

Standard spacing is not overridden (Tailwind defaults apply). Component-level size:
```
componentSizes.header = '3.5rem'   → --header-height: 3.5rem (in globals.css)
```
Also: `--footer-height: 4rem` is set in globals.css.

---

## 4. Typography

```ts
fontFamily.sans          = ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif']
fontFamily['noto-sans']  = ['var(--font-noto-sans)', 'Inter', '-apple-system', ...]   // English/Latin
fontFamily['noto-sans-jp'] = ['var(--font-noto-sans-jp)', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', ...]
fontFamily['noto-sans-sc'] = ['var(--font-noto-sans-sc)', 'Noto Sans TC', 'PingFang SC', ...]
```

Classes: `font-sans`, `font-noto-sans`, `font-noto-sans-jp`, `font-noto-sans-sc`

---

## 5. Border Radius

CSS var `--radius: 0.5rem` (8px) defined in globals.css `:root`.

| Token | Value | px equiv |
|---|---|---|
| `rounded-sm` | `calc(var(--radius) - 4px)` | ≈ 4px |
| `rounded-md` | `calc(var(--radius) - 2px)` | ≈ 6px |
| `rounded-lg` | `var(--radius)` | 8px |

---

