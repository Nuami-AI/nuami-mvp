## Core Philosophy

- **Clean Architecture First**: Separate concerns clearly — presentation, business logic, and data layers must be distinct and independently testable.
- **SOLID Principles**: Every class, module, and function you write must adhere to Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, and Dependency Inversion principles.
- **Scalability by Design**: Anticipate future growth. Design for extensibility without requiring major rewrites.
- **Readability Over Cleverness**: Code is written for humans first, machines second. Prioritize clarity.

## Project Context

This project uses a version of Next.js with potentially breaking changes from common training data. **Before writing any Next.js-specific code, always check `node_modules/next/dist/docs/` for the relevant guide** and adhere strictly to the conventions documented there. Do not assume standard Next.js APIs — verify them.

## Implementation Workflow

### 1. Understand Before You Code
- Clarify requirements if they are ambiguous before writing a single line of code.
- Identify the domain, use cases, and entities involved.
- Determine what already exists in the codebase to avoid duplication.

### 2. Design the Architecture
- Sketch the layer structure: entities → use cases → interfaces → infrastructure.
- Identify dependencies and inversion points (use interfaces/abstractions over concrete implementations).
- Plan the file/folder structure to reflect the architecture.

### 3. Implement Incrementally
- Start with domain entities and business logic (pure functions, no side effects).
- Move outward to use cases, then adapters/interfaces, then infrastructure.
- Each layer should be independently testable.

### 4. Code Quality Standards
- **Naming**: Variables, functions, and classes must have intention-revealing names. No single-letter variables except loop counters.
- **Functions**: Small and focused — a function does one thing only. Max ~20 lines as a guideline.
- **Error Handling**: Explicit and meaningful. Never swallow errors silently. Use typed error classes where appropriate.
- **Comments**: Explain *why*, not *what*. Code should be self-documenting; comments are for non-obvious decisions.
- **No Magic Numbers**: Use named constants.
- **DRY**: Abstract repeated logic, but don't over-abstract prematurely (rule of three).

### 5. Patterns and Practices
- Use **dependency injection** to decouple components.
- Prefer **composition over inheritance**.
- Use **repository pattern** for data access layers.
- Apply **factory patterns** where object creation is complex.
- Implement **interfaces/types** before concrete implementations.
- Use **command/query separation** (CQRS) where appropriate.

### 6. File Structure
Organize code to reflect architectural boundaries:
```
src/
  domain/        # Entities, value objects, domain services
  usecases/      # Application business rules
  interfaces/    # Controllers, presenters, gateways (abstractions)
  infrastructure/ # DB, external APIs, frameworks
  shared/        # Utilities, constants, cross-cutting concerns
```
Adapt this structure to fit the existing project conventions.

### 7. Self-Review Before Submitting
Before presenting your implementation, ask yourself:
- [ ] Does each module have a single, clear responsibility?
- [ ] Are dependencies pointing inward (toward domain)?
- [ ] Is this code testable without mocking the framework?
- [ ] Will this be easy to extend without modifying existing code?
- [ ] Are error cases handled explicitly?
- [ ] Is the naming self-explanatory?
- [ ] Have I checked the Next.js docs in `node_modules/next/dist/docs/` for any framework-specific APIs used?

